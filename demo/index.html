<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trail Flyover — prototyp</title>
<link rel="stylesheet" href="dist/maplibre-gl.css">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262a33; --text:#e9ecf1; --muted:#9aa3b2; --accent:#ff7a1a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { display:grid; grid-template-columns: 320px 1fr; height:100%; }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:18px 18px 28px; }
  h1 { font-size:18px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:16px; }
  h2 { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:20px 0 8px; font-weight:600; }
  .seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:6px; }
  .seg button, .btn { background:#20242d; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:9px 8px; cursor:pointer; font:inherit; }
  .seg button[aria-pressed="true"] { border-color:var(--accent); background:#2a1d14; color:#fff; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#1a0d02; font-weight:700; }
  .btn:disabled { opacity:.45; cursor:default; }
  select, input[type=text], input[type=password] { width:100%; background:#20242d; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:9px 10px; font:inherit; }
  label.row { display:flex; justify-content:space-between; align-items:center; margin:10px 0 4px; color:var(--muted); }
  label.row b { color:var(--text); font-weight:600; background:#2a1d14; color:#ffb27a; padding:1px 8px; border-radius:6px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .check { display:flex; gap:8px; align-items:center; margin-top:10px; color:var(--muted); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
  main { display:grid; grid-template-rows: 1fr auto; min-width:0; }
  #stage { position:relative; margin:16px; border-radius:14px; background:#0b0c0f; }
  .bar { display:flex; gap:10px; align-items:center; padding:0 16px 16px; }
  .bar input[type=range] { flex:1; }
  .time { font-variant-numeric: tabular-nums; color:var(--muted); min-width:92px; text-align:right; }
  .status { margin-top:14px; font-size:12px; color:var(--muted); min-height:18px; }
  .progress { height:4px; background:#262a33; border-radius:2px; overflow:hidden; margin-top:6px; }
  .progress i { display:block; height:100%; width:0; background:var(--accent); transition:width .1s; }
  .meta { font-size:12px; color:var(--muted); margin-top:12px; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; }
  .meta span:nth-child(odd) { color:#6f7787; }
  #downloads a { display:block; color:#ffb27a; margin-top:6px; font-size:13px; }
  .hint { font-size:11px; color:#6f7787; margin-top:4px; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Trail Flyover</h1>
    <div class="sub">Prototyp 3D průletu nad trasou · MapLibre</div>

    <h2>Trasa</h2>
    <input type="file" id="gpx" accept=".gpx" hidden>
    <select id="sample">
      <option value="tolmin.gpx">Tolmin → Gorica → Koper (121 km)</option>
    </select>
    <button class="btn" id="openGpx" style="width:100%;margin-top:6px">📂 Načíst vlastní GPX…</button>
    <div class="hint" id="trackInfo"></div>

    <h2>Zobrazení</h2>
    <div class="seg" id="mode">
      <button data-v="3d" aria-pressed="true">3D terén</button>
      <button data-v="2d">2D mapa</button>
    </div>

    <h2>Pohyb kamery</h2>
    <div class="seg" id="camera">
      <button data-v="follow" aria-pressed="true">Letí s trasou</button>
      <button data-v="static">Celá trasa (stojí)</button>
    </div>

    <h2>Poměr stran</h2>
    <div class="seg" id="aspect">
      <button data-v="story">Story 9:16</button>
      <button data-v="feed" aria-pressed="true">Feed 4:5</button>
      <button data-v="wide">Wide 16:9</button>
    </div>

    <h2>Mapový podklad</h2>
    <select id="basemap"></select>
    <div class="hint" id="basemapHint"></div>

    <label class="check"><input type="checkbox" id="snow"> ❄️ Zimní filtr (zasněžená krajina)</label>
    <div id="snowBox" hidden>
      <label class="row">Sněhová čára <b id="snowlineLabel">všude</b></label>
      <input type="range" id="snowline" min="0" max="1300" step="50" value="0">
      <div class="hint">0 = sníh všude; jinak pod danou výškou zůstane léto</div>
    </div>

    <h2>Kamera</h2>
    <div class="seg" id="preset">
      <button data-v="drone" aria-pressed="true">Dron</button>
      <button data-v="low">Nízký průlet</button>
      <button data-v="overview">Přehled</button>
    </div>
    <label class="row">Délka videa <b id="durLabel">auto</b></label>
    <input type="range" id="duration" min="0" max="60" step="1" value="0">
    <div class="hint">0 = automaticky podle délky trasy</div>
    <label class="row">Převýšení terénu <b id="exLabel">1.4×</b></label>
    <input type="range" id="exaggeration" min="1" max="2.5" step="0.1" value="1.4">
    <label class="check"><input type="checkbox" id="labels" checked> Názvy obcí a vrcholů (OSM)</label>
    <label class="row">Jen místa u trasy <b id="reachLabel">vesnice do 400 m</b></label>
    <input type="range" id="reach" min="50" max="400" step="25" value="100">
    <div class="hint">Název se objeví ve chvíli, kdy k místu trasa dojede.</div>
    <label class="check"><input type="checkbox" id="ghost" checked> Zbytek trasy slabě dopředu</label>

    <h2>Export</h2>
    <button class="btn" id="prefetch" style="width:100%">⤓ Přednačíst dlaždice pro plynulé přehrání</button>
    <div class="grid2">
      <button class="btn primary" id="exportMp4">Video MP4</button>
      <button class="btn" id="exportWebm">Video WebM</button>
      <button class="btn" id="exportPng">Fotka PNG</button>
      <button class="btn" id="cancel" disabled>Zrušit</button>
    </div>
    <div class="status" id="status"></div>
    <div class="progress"><i id="progress"></i></div>
    <div id="downloads"></div>

    <div class="meta" id="meta"></div>
  </aside>
  <main>
    <div id="stage"></div>
    <div class="bar">
      <button class="btn primary" id="play" style="min-width:110px">▶ Přehrát</button>
      <input type="range" id="scrub" min="0" max="1000" value="0">
      <span class="time" id="time">0.0 / 0.0 s</span>
    </div>
  </main>
</div>
<script type="module" src="dist/main.js"></script>
</body>
</html>
